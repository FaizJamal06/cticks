name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy public config so `next build` works without secrets. Never real values here.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-payup.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-payup
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-dummy
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5 # Firestore emulator needs Java 21+
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      # Vercel's functions can't require() ESM-only packages; this is what took every API route down once.
      - name: firebase-admin loads without require(esm)
        run: node --no-experimental-require-module -e "require('firebase-admin/auth'); require('firebase-admin/firestore'); require('firebase-admin/messaging')"
      - run: npm run build
